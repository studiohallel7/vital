name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Expo Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Android
        run: eas build --platform android --profile preview --non-interactive --local
        # Note: --local tries to build on Github Actions directly. 
        # If omitting --local, it uses Expo servers (requires EXPO_TOKEN).
        # We'll use local build to ensure it generates an artifact in the workflow.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📂 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hallel-mobile-apk
          path: build/*.apk
